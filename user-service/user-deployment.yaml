apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
      - name: db-migrate
        image: postgres:15
        command: ['psql', '-f', '/migrations/001_create_users.sql']
        env:
        - name: PGHOST
          value: users-db-svc
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: users_db
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: users-db-secret
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: users-db-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: migration-sql
          mountPath: /migrations
      volumes:
      - name: migration-sql
        configMap:
          name: users-migration
      containers:
      - name: user-service
        image: 905418181527.dkr.ecr.ap-southeast-1.amazonaws.com/user-service:v1
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: user-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: user-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: user-secret
              key: JWT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
