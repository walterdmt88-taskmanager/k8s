apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      initContainers:
      - name: db-migrate
        image: postgres:15
        command: ['psql', '-f', '/migrations/001_create_tables.sql']
        env:
        - name: PGHOST
          value: tasks-db-svc
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: tasks_db
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: tasks-db-secret
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tasks-db-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: migration-sql
          mountPath: /migrations
      volumes:
      - name: migration-sql
        configMap:
          name: tasks-migration
      containers:
      - name: task-service
        image: 905418181527.dkr.ecr.ap-southeast-1.amazonaws.com/task-service:v1
        ports:
        - containerPort: 3002
        envFrom:
        - configMapRef:
            name: task-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: task-secret
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: task-secret
              key: REDIS_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 15
          periodSeconds: 10
